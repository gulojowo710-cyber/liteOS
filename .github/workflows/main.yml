name: Build Minimal Linux OS
run-name: Build OS dari bzImage + busybox 🐧

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Merakit OS
    runs-on: ubuntu-22.04

    steps:
    - name: 📥 Checkout Repositori
      uses: actions/checkout@v4

    - name: 🔧 Pasang Alat Build
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          genisoimage syslinux isolinux cpio gzip fakeroot

    - name: 📋 Cek File Sumber
      run: |
        ls -lh bzImage busybox boot.img
        echo "✅ Semua file sumber ditemukan"

    - name: 📂 Siapkan Struktur ISO
      run: |
        mkdir -p iso/boot/isolinux iso/dev iso/proc iso/sys
        cp bzImage iso/boot/vmlinuz
        cp boot.img iso/boot/boot.img
        
        # ✅ PERBAIKAN: Jalur file isolinux yang benar di Ubuntu 22.04
        sudo cp /usr/lib/syslinux/bios/isolinux.bin iso/boot/isolinux/
        sudo cp /usr/lib/syslinux/bios/ldlinux.c32 iso/boot/isolinux/
        sudo cp /usr/lib/syslinux/bios/libcom32.c32 iso/boot/isolinux/
        sudo cp /usr/lib/syslinux/bios/libutil.c32 iso/boot/isolinux/
        sudo cp /usr/lib/syslinux/bios/libmenu.c32 iso/boot/isolinux/ 2>/dev/null || true
        
        echo "✅ File isolinux disalin ke struktur ISO"

    - name: 🧩 Buat Initramfs
      run: |
        mkdir -p initramfs/{bin,sbin,etc,home,root,dev,proc,sys,usr/bin,usr/sbin,lib,lib64}
        cd initramfs
        
        cp ../busybox bin/busybox
        chmod +x bin/busybox
        
        for cmd in $(./bin/busybox --list); do
          ln -sf busybox bin/$cmd
        done
        
        cat > init << 'EOF'
        #!/bin/sh
        export PATH=/bin:/sbin:/usr/bin:/usr/sbin
        mount -t proc proc /proc
        mount -t sysfs sysfs /sys
        mount -t devtmpfs devtmpfs /dev

        echo ""
        echo "  ██████╗ ██╗   ██╗███████╗██╗     ██╗  ██╗"
        echo "  ██╔══██╗██║   ██║██╔════╝██║     ██║ ██╔╝"
        echo "  ██████╔╝██║   ██║█████╗  ██║     █████╔╝ "
        echo "  ██╔═══╝ ██║   ██║██╔══╝  ██║     ██╔═██╗ "
        echo "  ██║     ╚██████╔╝███████╗███████╗██║  ██╗"
        echo "  ╚═╝      ╚═════╝ ╚══════╝╚══════╝╚═╝  ╚═╝"
        echo ""
        echo "  Minimal Linux OS — Berhasil Boot! 🎉"
        echo ""
        exec /bin/sh
        EOF
        chmod +x init
        
        cd ..
        echo "✅ Struktur initramfs selesai"

    - name: 📦 Pack Initramfs → initramfs.gz
      run: |
        cd initramfs
        fakeroot sh -c "find . -print0 | cpio --null -ov --format=newc | gzip -9 > ../iso/boot/initramfs.gz"
        cd ..
        ls -lh iso/boot/initramfs.gz
        echo "✅ Initramfs dibuat"

    - name: ⚙️ Konfigurasi Bootloader (isolinux.cfg) — FIXED
      run: |
        cat > iso/boot/isolinux/isolinux.cfg << 'EOF'
        DEFAULT linux
        LABEL linux
        SAY Booting Minimal Linux OS...
        KERNEL /boot/vmlinuz
        APPEND initrd=/boot/boot.img initrd=/boot/initramfs.gz rw quiet console=tty0
        EOF
        cat iso/boot/isolinux/isolinux.cfg
        # ✅ BARIS CP YANG SALAH DIHAPUS DI SINI!
        echo "✅ Konfigurasi isolinux.cfg selesai"

    - name: 💿 Buat ISO Bootable
      run: |
        cd iso
        genisoimage \
          -o ../Minimal-Linux-OS.iso \
          -J -l -V "MINIMAL_OS" \
          -no-emul-boot \
          -boot-load-size 4 \
          -boot-info-table \
          -b boot/isolinux/isolinux.bin \
          -c boot/isolinux/boot.cat \
          -R -r -T .
        cd ..
        ls -lh Minimal-Linux-OS.iso
        echo "✅ ISO berhasil dibuat!"

    - name: 📤 Upload ISO Hasil
      uses: actions/upload-artifact@v4
      with:
        name: Minimal-Linux-OS
        path: Minimal-Linux-OS.iso
        retention-days: 30

    - name: 📊 Ringkasan
      run: |
        echo "✅ Build Selesai!"
        echo "📦 File ISO: Minimal-Linux-OS.iso"
        echo "🖥️ Kernel: bzImage"
        echo "🔧 Userland: Busybox"
        echo "💾 Ukuran: $(du -h Minimal-Linux-OS.iso | cut -f1)"
