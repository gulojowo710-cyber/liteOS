name: Build VZLinux ISO dari Prebuilt

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: 📥 Checkout Repo
      uses: actions/checkout@v4
    - name: 🔧 Install Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y xorriso syslinux isolinux cpio gzip
    - name: 📦 Siapkan Struktur ISO
      run: |
        mkdir -p iso/boot iso/isolinux
        cp bzImage iso/boot/vmlinuz
    
        mkdir tmp_rootfs
        cd tmp_rootfs
        cpio -idm < ../boot.img 2>/dev/null || cp -a ../boot.img/* . 2>/dev/null || true
        mkdir -p bin sbin dev proc sys etc/init.d
        cp ../busybox bin/busybox
        cd bin 
        for i in sh init mount; do ln -sf busybox $i; done
        cd ../..
        find tmp_rootfs | cpio -H newc -o | gzip > iso/boot/initrd.gz

    - name: ⚙️ Buat Config Isolinux
      run: |
        cat > iso/isolinux/isolinux.cfg << 'EOF'
        DEFAULT linux
        TIMEOUT 50
        LABEL linux
        MENU LABEL Boot VZLinux
        KERNEL /boot/vmlinuz
        APPEND initrd=/boot/initrd.gz root=/dev/ram0 quiet
        EOF
        cp /usr/lib/syslinux/isolinux.bin iso/isolinux/
        cp /usr/lib/syslinux/modules/bios/ldlinux.c32 iso/isolinux/

    - name: 💿 Build ISO
      run: |
        xorriso -as mkisofs \
        -o VZLinux.iso \
        -b isolinux/isolinux.bin \
        -c isolinux/boot.cat \
        -no-emul-boot -boot-load-size 4 -boot-info-table \
        iso/
    - name: 📤 Upload ISO
      uses: actions/upload-artifact@v4
      with:
        name: VZLinux-Prebuilt
        path: VZLinux.iso
